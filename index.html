<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GYM</title>
<meta name="theme-color" content="#060a16"><meta name="color-scheme" content="dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GYM"><meta name="application-name" content="GYM">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
color-scheme:dark;
--bg:#060a16; --bg2:#0a1124; --surface:#0d1528; --surface2:#142040; --field:#050a15;
--text:#e8f1ff; --muted:#b9c8e2; --line:#233559; --fline:#4f7096;
--hud:#27e6ff; --hud-ink:#7ff0ff; --hud-rgb:39,230,255;
--push:#ff4d5e; --push-ink:#1a0406; --pull:#4da3ff; --pull-ink:#031226; --legs:#ffb020; --legs-ink:#1c1200; --rest:#2ee59d; --rest-ink:#03170e;
--good:#38e8a0; --good-soft:#0f2a22; --warn:#ffc24d; --warn-soft:#2a2210; --bad:#ff7a85; --bad-soft:#2f1519; --bad-ink:#1a0508;
--accent:var(--hud-ink);
--cur:var(--pull); --cur-ink:var(--pull-ink);
--c:var(--hud); --ci:#031226; --crgb:var(--hud-rgb);
--display:"Chakra Petch","Rajdhani","Arial Narrow","Helvetica Neue",Arial,sans-serif;
--font:"Barlow","Helvetica Neue",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
}
html{background-color:var(--bg);-webkit-text-size-adjust:100%;font-size:14px}
html[data-plate="push"]{--cur:var(--push);--cur-ink:var(--push-ink)}
html[data-plate="pull"]{--cur:var(--pull);--cur-ink:var(--pull-ink)}
html[data-plate="legs"]{--cur:var(--legs);--cur-ink:var(--legs-ink)}
html[data-plate="rest"]{--cur:var(--rest);--cur-ink:var(--rest-ink)}
.t-push{--c:var(--push);--ci:var(--push-ink);--crgb:255,77,94}
.t-pull{--c:var(--pull);--ci:var(--pull-ink);--crgb:77,163,255}
.t-legs{--c:var(--legs);--ci:var(--legs-ink);--crgb:255,176,32}
.t-rest{--c:var(--rest);--ci:var(--rest-ink);--crgb:46,229,157}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums;
background-color:var(--bg);
background-image:linear-gradient(rgba(var(--hud-rgb),.04) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--hud-rgb),.04) 1px,transparent 1px),radial-gradient(120% 55% at 50% -8%,rgba(40,110,255,.18),transparent 62%);
background-size:32px 32px,32px 32px,auto;
padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
img{max-width:100%}
[hidden]{display:none!important}
.hide{display:none!important}
.num,input,td,th{font-variant-numeric:tabular-nums}
/* header */
.hdr{position:relative;background:linear-gradient(180deg,#0c1630,#080e20);color:var(--text);border-bottom:1px solid rgba(var(--hud-rgb),.45);box-shadow:0 1px 16px rgba(var(--hud-rgb),.14);
padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr::after{content:"";position:absolute;left:0;bottom:-1px;width:96px;height:3px;background:var(--cur);box-shadow:0 0 10px var(--cur)}
.hdr .in{max-width:640px;margin-inline:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.hdr h1{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.18em;line-height:1.1;margin:0;color:var(--hud-ink);text-shadow:0 0 14px rgba(var(--hud-rgb),.55)}
.hdr .sub{color:var(--muted);font-size:.8rem;margin-top:3px;line-height:1.3;letter-spacing:.02em}
.hdr .btn{flex:none}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
.inner{max-width:640px;margin-inline:auto}
h2{font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;color:var(--hud-ink);margin:28px 0 10px;line-height:1.2;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--hud-rgb),.5),transparent)}
h2:first-child{margin-top:0}
h3{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;margin:0;line-height:1.25}
p{margin:0 0 8px}
.sub{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.note{font-size:.85rem;color:var(--muted);margin:6px 0 12px}
/* buttons */
.btn{font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;min-height:44px;padding:8px 16px;border:1px solid rgba(var(--hud-rgb),.5);background:var(--surface2);color:var(--text);cursor:pointer;
clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);box-shadow:inset 0 0 12px rgba(var(--hud-rgb),.12)}
.btn.primary{background:var(--cur);color:var(--cur-ink);border-color:var(--cur);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.btn.startbtn{background:var(--c);color:var(--ci);border-color:var(--c)}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:inset 0 0 12px rgba(255,77,94,.12)}
.btn.armed{background:var(--bad);color:var(--bad-ink);border-color:var(--bad)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.block{width:100%}
.btn.primary.block{min-height:54px;font-size:1.05rem;letter-spacing:.16em}
.btn:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--hud);outline-offset:3px}
.btn:focus-visible,.tab:focus-visible,.rtile:focus-visible,summary:focus-visible{outline:3px solid var(--hud-ink);outline-offset:-5px;box-shadow:inset 0 0 14px rgba(var(--hud-rgb),.6)}
.btn.primary:focus-visible,.btn.armed:focus-visible{outline-color:var(--ci,var(--cur-ink))}
.btn.primary:not(.startbtn):focus-visible{outline-color:var(--cur-ink)}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);padding:8px 12px;margin-bottom:12px;font-size:.9rem}
/* panels */
.card,.panel{position:relative;background:linear-gradient(180deg,rgba(20,32,64,.55),rgba(13,21,40,.95));border:1px solid #243a62;padding:12px;margin-bottom:10px;
clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);box-shadow:inset 0 0 22px rgba(var(--hud-rgb),.06)}
.card::after,.panel::after,.ex::after,.daycard::after,.rtile::after,.rdetail::after{content:"";position:absolute;top:0;right:0;width:12px;height:12px;pointer-events:none;
background:linear-gradient(to bottom left,transparent calc(50% - .75px),rgba(var(--hud-rgb),.7) calc(50% - .75px),rgba(var(--hud-rgb),.7) calc(50% + .75px),transparent calc(50% + .75px))}
.warnbox,.warn{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 10px;color:#ffe2a6}
.panel.warnp,.card.warnp{border-left:4px solid var(--warn)}
.msg{font-size:.95rem;margin:8px 0;font-weight:600}
.msg.ok{color:var(--good)}
.msg.err{color:var(--bad)}
label.fld{display:block;font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-size:16px;width:100%;min-height:46px;padding:8px 10px;border-radius:2px;border:1px solid var(--fline);background:var(--field);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--hud);outline-offset:1px;border-color:var(--hud);box-shadow:0 0 0 1px var(--hud),0 0 16px rgba(var(--hud-rgb),.5)}
textarea{min-height:90px;resize:vertical}
input[type=file]{max-width:100%;font-size:16px;color:var(--text);min-height:44px;padding:8px 0}
.searchwrap{position:relative;margin-bottom:6px}
.searchwrap input{padding-left:40px;font-family:var(--display);font-weight:500;letter-spacing:.04em}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--hud-ink);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
/* hero */
.hero{position:relative;padding:18px 20px 14px;margin-bottom:12px;color:var(--text);
background:linear-gradient(155deg,rgba(var(--crgb),.22),rgba(var(--crgb),.05) 58%),var(--surface);
box-shadow:inset 0 0 0 1px rgba(var(--crgb),.6),inset 0 0 34px rgba(var(--crgb),.14);
clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px)}
.hero .br{position:absolute;width:16px;height:16px;border:2px solid var(--c);pointer-events:none}
.hero .br.tl{top:8px;left:8px;border-right:0;border-bottom:0}
.hero .br.tr{top:8px;right:8px;border-left:0;border-bottom:0}
.hero .br.bl{bottom:8px;left:8px;border-right:0;border-top:0}
.hero .br.brr{bottom:8px;right:8px;border-left:0;border-top:0}
.hero .k{font-family:var(--display);font-weight:600;font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.hero .k::before{content:"";display:inline-block;width:8px;height:8px;background:var(--c);margin-right:8px;box-shadow:0 0 8px var(--c)}
.hero .v{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1.05;letter-spacing:.04em;text-transform:uppercase;margin-top:4px;color:var(--c);text-shadow:0 0 22px rgba(var(--crgb),.55)}
.hero .s{font-family:var(--display);font-weight:500;font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.hero .stats{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin-top:14px;padding-top:10px;border-top:1px dashed rgba(var(--crgb),.5)}
.hero .stat{display:block}
.hero .stat span{display:block;font-family:var(--display);font-weight:600;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.hero .stat b{display:block;font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.2;letter-spacing:.03em;color:var(--text)}
.startwrap{margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* chips + thumbs */
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.mchip{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--hud-ink);background:rgba(var(--hud-rgb),.09);border:1px solid rgba(var(--hud-rgb),.4);padding:1px 8px;line-height:1.5}
.thumb{flex:none;position:relative;display:flex;align-items:center;justify-content:center;width:64px;height:64px;background:var(--surface2);border:1px solid rgba(var(--hud-rgb),.4);overflow:hidden;
clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.thumb.sm{width:56px;height:56px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.thumb img{display:block;width:100%;height:100%;max-width:none;object-fit:cover;background:var(--surface2)}
.thumb .phg{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.thumb svg{width:30px;height:30px;stroke:var(--hud-ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.exrow{display:flex;gap:12px;align-items:flex-start;min-width:0}
.exmain{flex:1;min-width:0}
.ex{position:relative;background:linear-gradient(180deg,rgba(20,32,64,.5),rgba(13,21,40,.95));border:1px solid #243a62;border-left:4px solid var(--c,var(--cur));padding:12px;margin-bottom:10px;
clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);box-shadow:inset 0 0 20px rgba(var(--crgb,var(--hud-rgb)),.06)}
.ex-name{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.03em;line-height:1.25;overflow-wrap:anywhere}
.ex-target{color:var(--text);font-weight:500;font-size:.9rem;margin-top:2px}
.ex-last{color:var(--muted);font-size:.88rem;margin-top:6px}
details.expl{margin:4px 0 0}
details.expl>summary,details.dfull>summary,details.day>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--hud-ink);list-style:none}
details.day>summary,details.dfull>summary{color:var(--text)}
details.expl>summary::-webkit-details-marker,details.day>summary::-webkit-details-marker,details.dfull>summary::-webkit-details-marker{display:none}
details.expl>summary::before,details.day>summary::before,details.dfull>summary::before{content:"+";display:inline-block;width:22px;font-weight:700;color:var(--hud)}
details[open].expl>summary::before,details[open].day>summary::before,details[open].dfull>summary::before{content:"\2212"}
details.day{position:relative;background:var(--surface);border:1px solid #243a62;border-left:4px solid var(--c,rgba(var(--hud-rgb),.6));padding:0 12px;margin-bottom:10px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
details.day[open]{padding-bottom:4px}
details.day .ex,.dfull .ex{margin-top:2px;background:var(--surface2)}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.imgs figure{margin:0;min-width:0}
.imgs img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface2);border:1px solid rgba(var(--hud-rgb),.3)}
.imgs figcaption{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--muted);margin-top:2px}
.imgmiss{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.85rem;color:var(--muted);background:var(--surface2);padding:6px}
.noimg{background:var(--surface2);padding:10px;color:var(--muted);font-size:.9rem;margin:6px 0;border-left:3px solid var(--hud)}
.cue{margin:6px 0}
a.vid{display:inline-flex;align-items:center;min-height:44px;color:var(--hud-ink);font-weight:600}
/* set logging console */
.sets{margin-top:8px;padding:8px 10px 10px;background:rgba(3,7,16,.7);border:1px solid #1f3558;box-shadow:inset 0 0 18px rgba(var(--hud-rgb),.06)}
.srow{display:grid;grid-template-columns:4.2rem 1fr 1fr;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed #1f3558}
.srow.hd{font-family:var(--display);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:.8rem;color:var(--hud-ink);border-bottom:1px solid rgba(var(--hud-rgb),.5);padding-bottom:4px}
.srow.hd span:not(:first-child){text-align:center}
.srow .sn{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem;color:var(--muted)}
.srow input.cell{min-height:50px;font-family:var(--display);font-size:1.3rem;font-weight:600;text-align:center;padding-inline:4px}
.setbtns{display:flex;gap:8px;margin-top:8px}
.chk{display:flex;gap:10px;align-items:center;min-height:48px;cursor:pointer}
.chk input{width:26px;height:26px;accent-color:var(--hud);flex:none;margin:0}
.chk small{display:block;color:var(--muted)}
.chk .nm{font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.03em;line-height:1.25}
.cor{border-bottom:1px solid #1c2e50;padding-bottom:2px;margin-bottom:6px}
.cor:last-child{border-bottom:0}
.dayh{border-left:6px solid var(--c);padding-left:10px;color:var(--c)}
/* plan */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.wd{background:var(--surface);border:1px solid #243a62;border-left:4px solid var(--c);padding:6px 10px;box-shadow:inset 0 0 14px rgba(var(--crgb),.1)}
.wd b{display:block;font-family:var(--display);font-size:1.3rem;line-height:1.1;color:var(--c)}
.wd span{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem}
.panel ul{margin:8px 0 0;padding:0;list-style:none}
.panel li{padding:8px 10px;margin-bottom:6px;background:rgba(5,10,21,.6);border-left:3px solid rgba(var(--hud-rgb),.6);font-size:.95rem}
.panel li.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.daycard{position:relative;background:linear-gradient(180deg,rgba(20,32,64,.55),rgba(13,21,40,.95));border:1px solid #243a62;border-left:4px solid var(--c);padding:12px 12px 4px;margin-bottom:12px;
clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);box-shadow:inset 0 0 24px rgba(var(--crgb),.1)}
.dchead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dchead h3{color:var(--text);overflow-wrap:anywhere}
.tag{display:inline-block;font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem;color:var(--c,var(--muted));border:1px solid currentColor;padding:1px 8px;white-space:nowrap}
td .tag,h3 .tag{margin-left:8px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 10px;margin:4px 0 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;max-width:100%;border-top:1px dashed rgba(var(--crgb,var(--hud-rgb)),.35);border-bottom:1px dashed rgba(var(--crgb,var(--hud-rgb)),.35)}
.strip .thumb{flex:none}
.pitem{flex:none;width:84px;font-family:var(--display);font-weight:500;font-size:.8rem;line-height:1.25;letter-spacing:.02em;color:var(--text)}
.pitem .thumb{width:84px;height:64px;margin-bottom:4px}
.daycard .startbtn{margin:2px 0 4px}
/* recovery */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rtile{position:relative;text-align:left;min-height:100px;padding:10px 12px 12px;background:linear-gradient(180deg,rgba(20,32,64,.55),rgba(13,21,40,.95));border:1px solid #2a4468;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;
clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.rtile[aria-expanded="true"]{border-color:var(--hud);box-shadow:inset 0 0 22px rgba(var(--hud-rgb),.22)}
.rname{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rline{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.rpct{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.15}
.rstat{font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.rbar{display:block;height:5px;background:#16233f;margin:4px 0 6px}
.rbar i{display:block;height:100%}
.rsub{font-size:.82rem;color:var(--muted);line-height:1.3}
.lv-g .rpct,.lv-g .rstat{color:var(--good)} .lv-g .rbar i{background:var(--good);box-shadow:0 0 8px var(--good)}
.lv-a .rpct,.lv-a .rstat{color:var(--warn)} .lv-a .rbar i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.lv-r .rpct,.lv-r .rstat{color:var(--bad)} .lv-r .rbar i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.rdetail{grid-column:1/-1;position:relative;background:rgba(8,14,30,.95);border:1px solid var(--hud);padding:12px;box-shadow:inset 0 0 26px rgba(var(--hud-rgb),.1);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);min-width:0}
.rdetail h3{font-size:.85rem;letter-spacing:.14em;color:var(--hud-ink);margin:0 0 6px}
.rdetail h3+*{margin-bottom:12px}
.hrow{display:grid;grid-template-columns:5.5rem 1fr;gap:2px 10px;padding:6px 0;border-bottom:1px dashed #1f3558;font-size:.9rem}
.hrow:last-child{border-bottom:0}
.hrow .hd1{color:var(--muted)}
.hrow .hs{grid-column:2;font-family:var(--display);font-weight:600;letter-spacing:.03em}
/* tables */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #243a62;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #1c2e50;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--surface2);font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;color:var(--muted)}
td.wrapc{white-space:normal;min-width:130px}
tr.sub td{font-weight:700;background:var(--surface2)}
.chip{display:inline-block;padding:2px 12px;font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem;border:1px solid currentColor}
.chip.early{background:var(--surface2);color:var(--muted)}
.chip.now{background:var(--good-soft);color:var(--good)}
.chip.late{background:var(--bad-soft);color:var(--bad)}
.up{color:var(--bad)} .down{color:var(--good)}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid #243a62}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:#1c2e50;stroke-width:1}
.chart .ln{fill:none;stroke:var(--hud);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--surface);stroke:var(--hud);stroke-width:2}
.chart .dot.last{fill:var(--hud)}
.chart text.lv{fill:var(--text);font-weight:700;font-size:11px}
.sess{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1c2e50}
.sess:last-child{border-bottom:0}
.sess .t{min-width:0}
.sess .nm{font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.04em;text-transform:uppercase}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum div{background:var(--surface2);border-left:3px solid var(--hud);padding:8px 10px;font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;color:var(--muted)}
.sum b{display:block;font-size:1.9rem;line-height:1.1;color:var(--text);letter-spacing:.02em}
.rev{border-bottom:1px solid #1c2e50;padding:8px 0}
.rev:last-child{border-bottom:0}
.rev .rt{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem}
.rev .rv{font-weight:700;color:var(--text)}
.rev .rd{font-size:.9rem;color:var(--muted)}
ul.plain{margin:0;padding:0;list-style:none}
ul.plain li{padding:8px 10px;margin-bottom:6px;background:var(--surface);border:1px solid #243a62;border-left:3px solid rgba(var(--hud-rgb),.6)}
ul.plain li.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.rev.warn{margin:4px 0}
/* tab dock */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:linear-gradient(180deg,#0c1630,#060a16);border-top:1px solid rgba(var(--hud-rgb),.55);box-shadow:0 -8px 26px rgba(0,0,0,.55),0 -1px 16px rgba(var(--hud-rgb),.18);
padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;font-family:var(--display);font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;min-height:60px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--hud-ink);text-shadow:0 0 10px rgba(var(--hud-rgb),.6)}
.tab[aria-selected="true"] svg{stroke-width:2.4;filter:drop-shadow(0 0 4px rgba(var(--hud-rgb),.8))}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--hud);box-shadow:0 0 12px 1px var(--hud)}
#backupPanel{margin-bottom:14px}
#backupPanel textarea{font-size:16px;min-height:90px}
#exFirst{scroll-margin-top:12px}
/* ===== v2: FitAI-style workout flow ===== */
h2{font-size:1.15rem;font-weight:600;letter-spacing:.03em;text-transform:none;margin:36px 0 14px}
h3{font-size:1.05rem;letter-spacing:.02em;text-transform:none}
.page{padding-block:22px}
.card,.panel{padding:16px;margin-bottom:16px}
.ex{padding:14px;margin-bottom:14px}
.note{margin:8px 0 16px}
.btn{text-transform:none;letter-spacing:.04em;font-size:1rem}
.btn.primary,.btn.primary.block{text-transform:uppercase;letter-spacing:.12em}
.btn.primary.block{min-height:56px}
.btn.small{font-size:.92rem;letter-spacing:.03em}
.btn.ghost{background:transparent;box-shadow:none;clip-path:none;border-radius:3px;border-color:rgba(var(--hud-rgb),.5);color:var(--hud-ink)}
.btn.primary.startbtn,.btn.startbtn{background:var(--c);color:var(--ci);border-color:var(--c)}
.linkbtn{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font-family:var(--display);font-weight:600;font-size:.95rem;min-height:44px;padding:8px 14px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.linkbtn.armed{color:var(--bad)}
.linkbtn:focus-visible{outline:3px solid var(--hud-ink);outline-offset:-3px}
.mchip{text-transform:none;letter-spacing:.03em;font-size:.76rem;padding:0 9px;font-weight:500}
.chips{gap:6px;margin-top:8px}
.sess .nm{text-transform:none;letter-spacing:.02em}
.sess{padding:10px 0}
/* hero */
.hero{padding:20px 20px 16px;margin-bottom:16px}
.hero .top{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:12px;align-items:center}
.hero .v{font-size:2.7rem;margin-top:6px}
.hero .s{font-size:1.05rem;letter-spacing:.04em;text-transform:none;color:var(--text);opacity:.92}
.hero .hmap{width:132px}
.hero .chips{margin-top:12px}
.hero .stats{margin-top:16px;padding-top:12px}
.hero .k{letter-spacing:.18em}
.hero .stat b{font-size:1.3rem}
.bm{display:block;width:100%;height:auto}
.startwrap{margin-bottom:14px}
.subrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:2px 11px;font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.03em;line-height:1.2;border:1px solid rgba(var(--hud-rgb),.5);color:var(--hud-ink);background:rgba(var(--hud-rgb),.09);border-radius:999px;white-space:nowrap}
.pill.done{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.pill.resumed{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);white-space:normal;text-align:center}
.msg{margin:0 0 16px}
/* thumbnails on a light tile */
.thumb{width:72px;height:72px;background:#eef3fa;border:1px solid rgba(var(--hud-rgb),.5)}
.thumb.sm{width:56px;height:56px}
.thumb img{background:#eef3fa}
.thumb svg{stroke:#3b5f8f;opacity:1}
.pitem .thumb{width:84px;height:64px}
/* pelvic routine row */
details.corrow{position:relative;margin-bottom:8px;background:linear-gradient(180deg,rgba(20,32,64,.55),rgba(13,21,40,.95));border:1px solid #243a62;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
details.corrow>summary{min-height:60px;display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer;list-style:none;font-family:var(--display);font-weight:600;font-size:1.05rem}
details.corrow>summary::-webkit-details-marker{display:none}
details.corrow>summary .sp{flex:1}
details.corrow>summary::after{content:"+";font-weight:700;color:var(--hud);width:16px;text-align:center}
details[open].corrow>summary::after{content:"\2212"}
details.corrow>summary:focus-visible{outline:3px solid var(--hud-ink);outline-offset:-4px}
details.corrow .cwrap{padding:0 16px 14px}
.cor{padding-bottom:6px;margin-bottom:10px}
/* exercise list */
.xlist{display:flex;flex-direction:column;gap:14px}
.xrow{position:relative;display:flex;gap:14px;align-items:center;width:100%;min-height:100px;padding:14px 14px 14px 12px;text-align:left;font:inherit;color:var(--text);cursor:pointer;background:linear-gradient(180deg,rgba(20,32,64,.55),rgba(13,21,40,.95));border:1px solid #243a62;border-left:4px solid var(--c,var(--cur));clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);box-shadow:inset 0 0 20px rgba(var(--crgb,var(--hud-rgb)),.08)}
.xrow:focus-visible,.dchead:focus-visible,.wd:focus-visible,.xback:focus-visible{outline:3px solid var(--hud-ink);outline-offset:-4px;box-shadow:inset 0 0 14px rgba(var(--hud-rgb),.6)}
.xrow .xmain{flex:1;min-width:0;display:block}
.xrow .xname{display:block;font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.25;letter-spacing:.02em}
.xrow .xtarget{display:block;color:var(--muted);font-size:.92rem;margin-top:2px}
.xrow .chips{display:flex;margin-top:6px}
.xrow .pill{flex:none}
/* exercise screen */
.xscreen{padding-bottom:8px}
.xback>span{margin-right:6px}
.xback{display:inline-flex;align-items:center;min-height:44px;margin:0 0 6px -8px;padding:6px 12px;background:none;border:0;color:var(--hud-ink);font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.04em;cursor:pointer}
.xscreen .kicker{font-family:var(--display);font-weight:600;font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.xtitle{display:block;margin:4px 0 0;font-size:1.65rem;font-weight:700;letter-spacing:.01em;line-height:1.2;color:var(--text);outline:none}
.xtitle::after{display:none}
.xtarget2{margin-top:14px;font-family:var(--display);font-weight:600;font-size:1.15rem;color:var(--c,var(--hud-ink))}
.xscreen .ex-last{margin:4px 0 16px}
.xscreen .imgs{gap:10px;margin:0 0 4px}
.xscreen .cue{margin:12px 0 4px}
.xscreen a.vid{margin-bottom:8px}
.xscreen .sets{margin-top:12px;padding:10px 12px 14px}
.srow.x{grid-template-columns:2.2rem minmax(0,1fr) minmax(0,1fr) 52px;gap:10px;padding:8px 6px;margin:0 -6px}
.srow.x.hd{padding-block:0 6px}
.srow.x.hd span:first-child{text-align:center}
.srow.x .sn{text-align:center;font-size:1.1rem;color:var(--muted)}
.srow.x.isdone{background:rgba(56,232,160,.1);border-bottom-color:rgba(56,232,160,.4)}
.srow.x.isdone .sn{color:var(--good)}
.srow.x.isdone input.cell{border-color:var(--good)}
.dbtn{width:52px;min-height:52px;padding:0;font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1;border:2px solid var(--fline);background:var(--field);color:var(--muted);cursor:pointer;border-radius:2px}
.dbtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--rest-ink)}
.setbtns{margin-top:12px}
.setbtns .btn{flex:1}
.xnav{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-top:24px}
.xnav.one{grid-template-columns:1fr}
.xnav .btn{min-height:54px}
.finish{margin-top:20px}
/* plan nav */
button.wd{font:inherit;color:var(--text);text-align:left;min-height:60px;cursor:pointer;width:100%}
button.wd b,button.wd span{display:block}
.week{gap:10px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.daycard{padding:12px 16px 6px;margin-bottom:18px}
h3.dch3{margin:0;text-transform:none}
.dchead{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:12px;align-items:center;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:4px 0 8px;min-height:64px;cursor:pointer}
.dchead .dctxt{display:block;min-width:0}
.dchead .dcname{display:block;font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:.02em;line-height:1.25;overflow-wrap:anywhere;margin-bottom:6px}
.dchead .tag{margin:0}
.dchead .chips{display:flex}
.dchead .dcmap{display:block;width:88px}
.strip{padding:12px 2px;margin:6px 0 12px}
/* recovery */
.rgrid{gap:12px}
.rtile{min-height:120px;padding:12px 12px 14px;gap:2px}
.rtile .rtop{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.rtile .rtxt{display:flex;flex-direction:column;min-width:0;flex:1}
.rtile .rmap{display:block;width:60px;flex:none}
.rtile .rname{letter-spacing:.1em;font-size:.76rem}
.rtile .rtop{align-items:flex-end}
.rtile .rmap{margin-top:-4px}
.rtile .rpct{font-size:1.7rem;line-height:1.1}
.rbar{margin:8px 0 6px}
/* rest timer */
.restbar{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom,0px));z-index:19;background:linear-gradient(180deg,#112651,#0a1630);border-top:1px solid var(--hud);box-shadow:0 -6px 24px rgba(0,0,0,.6),0 -1px 18px rgba(var(--hud-rgb),.35);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.restbar .in{max-width:640px;margin-inline:auto;display:flex;align-items:center;gap:10px}
.restbar .rt{flex:1;min-width:0}
.restbar .rl{font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.restbar .tm{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1.05;color:var(--hud-ink);text-shadow:0 0 14px rgba(var(--hud-rgb),.5)}
.restbar.done .tm{font-size:1.15rem;line-height:1.3;color:var(--text)}
.restbar .btn{flex:none;min-width:64px}
body.hastimer{padding-bottom:calc(176px + env(safe-area-inset-bottom,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: no-preference){
.restbar.done{animation:rpulse .9s ease-out 3}
@keyframes rpulse{0%{box-shadow:0 -6px 24px rgba(0,0,0,.6),0 0 0 0 rgba(39,230,255,.7)}100%{box-shadow:0 -6px 24px rgba(0,0,0,.6),0 0 0 22px rgba(39,230,255,0)}}
}
@media (prefers-reduced-motion: no-preference){
.tab{transition:color .15s}
.hero{animation:heroIn .6s ease-out both}
@keyframes heroIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;scroll-behavior:auto!important} }
/* machine / free choice */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.segb{position:relative;min-height:64px;min-width:0;padding:8px 10px;text-align:left;font:inherit;color:var(--text);cursor:pointer;background:var(--field);border:1px solid var(--fline);border-radius:2px;display:flex;flex-direction:column;gap:2px}
.segb[aria-pressed="true"]{border:2px solid var(--hud);background:rgba(var(--hud-rgb),.14);padding:7px 9px;box-shadow:0 0 12px rgba(var(--hud-rgb),.25)}
.segb:focus-visible{outline:3px solid var(--hud-ink);outline-offset:2px}
.segtop{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.seglbl{font-family:var(--display);font-weight:600;font-size:.92rem;letter-spacing:.08em;text-transform:uppercase}
.segb[aria-pressed="true"] .seglbl::before{content:"\2713\00a0";color:var(--hud-ink)}
.segname{font-size:.8rem;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.segrec{font-family:var(--display);font-weight:600;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--good);border:1px solid var(--good);background:var(--good-soft);padding:0 5px;line-height:1.5}
.recwhy{margin:8px 0 4px;font-size:.88rem;color:var(--muted)}
.ktag{display:inline-block;vertical-align:middle;margin-left:8px;font-family:var(--display);font-weight:600;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--hud-ink);border:1px solid rgba(var(--hud-rgb),.5);padding:0 6px;line-height:1.5}
.altline{margin-top:6px;font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}

.optpanel{margin:12px 0 0}
.optcur{display:flex;gap:12px;align-items:center;padding:10px;background:rgba(var(--hud-rgb),.1);border:1px solid rgba(var(--hud-rgb),.45);border-radius:2px}
.optcur .thumb{flex:none}
.optmain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.optname{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.25;letter-spacing:.02em;overflow-wrap:anywhere}
.eqtag{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:.78rem;line-height:1.35;color:var(--hud-ink);border:1px solid rgba(var(--hud-rgb),.5);padding:1px 7px 1px 5px}
.eqtag svg{flex:none;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eqtag span{min-width:0;overflow-wrap:anywhere}
.optbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;margin-top:8px;padding:8px 12px;font:inherit;font-family:var(--display);font-weight:600;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text);cursor:pointer;background:var(--field);border:1px solid var(--fline);border-radius:2px;text-align:left}
.optbtn:focus-visible,.optrow:focus-visible{outline:3px solid var(--hud-ink);outline-offset:2px}
.optbtn .chev{flex:none;transition:transform .15s}
.optbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.optlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.optrow{display:flex;gap:12px;align-items:center;width:100%;min-height:68px;padding:6px 10px;font:inherit;color:var(--text);text-align:left;cursor:pointer;background:var(--field);border:1px solid var(--fline);border-radius:2px}
.optrow[aria-pressed="true"]{border:2px solid var(--hud);padding:5px 9px;background:rgba(var(--hud-rgb),.14);box-shadow:0 0 12px rgba(var(--hud-rgb),.25)}
.optrow .thumb{flex:none}
.optbadges{display:flex;flex-wrap:wrap;gap:4px 6px}
.optcur-mark{font-family:var(--display);font-weight:600;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--hud-ink);border:1px solid var(--hud-ink);padding:0 5px;line-height:1.5}
.xrow .ktag{max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.optsline{margin-top:6px;font-size:.8rem;line-height:1.35;color:var(--muted);overflow-wrap:anywhere}

.formchk{display:grid;gap:8px;margin:10px 0 6px}.formchk .fc{display:grid;grid-template-columns:4.6rem 1fr;gap:10px;align-items:start;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.45}.formchk .fl{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--hud-ink);padding-top:2px}
.lb{position:fixed;inset:0;z-index:100;background:rgba(2,5,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

/* v6: data-loss guards */
.alertpanel{margin:0 0 14px;padding:14px;border:1px solid var(--warn);background:var(--warn-soft)}
.alertpanel .ap-t{margin:6px 0 4px;font-family:var(--display);font-weight:600;font-size:1.05rem;color:#ffe2a6;overflow-wrap:anywhere}
.alertpanel .ap-n{margin:2px 0 0}
.alertpanel .fp-btns .btn{flex:1 1 100%}
.savedcard{margin:0 0 14px;padding:12px 14px;border:1px solid var(--good);background:var(--good-soft)}
.savedcard .sc-t{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--good);overflow-wrap:anywhere}

function firstSentence(t){
t=String(t); var re=/\.\s/g, m;
while((m=re.exec(t))){
var before=t.slice(0,m.index);

return t.slice(0,m.index+1);
}
return t;
}

/* ---------- charts ---------- */
function lineChart(pts,unit,aria,pre){
pre=pre||"";
var W=320,H=176,pl=40,pr=14,pt=18,pb=28;
var vals=pts.map(function(p){return p.v;});
var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
if(mn===mx){mn-=1;mx+=1;} else {var pad2=(mx-mn)*0.12;mn-=pad2;mx+=pad2;}
function X(i){return pts.length===1?(pl+(W-pl-pr)/2):pl+(W-pl-pr)*i/(pts.length-1);}
function Y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));}
var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+aria+'">';
for(var g=0;g<3;g++){
var gv=mn+(mx-mn)*g/2, gy=Y(gv);
s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'"/>';
s+='<text x="'+(pl-6)+'" y="'+(gy+3)+'" text-anchor="end">'+fmtNum(gv)+'</text>';
}
s+='<polyline class="ln" points="'+pts.map(function(p,i){return X(i).toFixed(1)+","+Y(p.v).toFixed(1);}).join(" ")+'"/>';
pts.forEach(function(p,i){
var last=i===pts.length-1;
s+='<circle class="dot'+(last?" last":"")+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last?5:3)+'"/>';
});
var lp=pts[pts.length-1];
s+='<text class="lv" x="'+Math.min(W-pr,X(pts.length-1)).toFixed(1)+'" y="'+(Y(lp.v)-9).toFixed(1)+'" text-anchor="'+(X(pts.length-1)>W-80?"end":"middle")+'">'+pre+fmtNum(lp.v)+' '+unit+'</text>';
s+='<text x="'+pl+'" y="'+(H-8)+'" text-anchor="start">'+shortDate(pts[0].d)+'</text>';
if(pts.length>1) s+='<text x="'+(W-pr)+'" y="'+(H-8)+'" text-anchor="end">'+shortDate(lp.d)+'</text>';
s+='</svg>';
