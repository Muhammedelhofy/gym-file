<style>
:root{

--accent:#1f4fbf;
--push:#c4271f; --push-ink:#ffffff; --pull:#1d5ad0; --pull-ink:#ffffff; --legs:#f2c200; --legs-ink:#1b1700; --rest:#1b7f45; --rest-ink:#ffffff;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

[hidden]{display:none!important}

.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
.inner{max-width:640px;margin-inline:auto}
.num,input,td,th{font-variant-numeric:tabular-nums}

h3{font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase;margin:0;line-height:1.2}
p{margin:0 0 8px}
.sub{color:var(--muted)}
.btn{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;min-height:44px;padding:8px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.btn.primary{background:var(--cur);color:var(--cur-ink);border-color:var(--cur)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);color:var(--bad-ink);border-color:var(--bad)}
.btn.small{min-height:44px;padding:6px 12px;font-size:.95rem}
.btn.block{width:100%}
.btn.primary.block{min-height:52px;font-size:1.2rem}
.btn:disabled{opacity:.45}
:focus-visible{outline:3px solid var(--text);outline-offset:2px;box-shadow:0 0 0 5px var(--bg)}
.hdr :focus-visible{outline-color:#fff;box-shadow:none}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.note{font-size:.85rem;color:var(--muted);margin:6px 0 12px}
.warnbox,.warn{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:6px}
.msg{font-size:.95rem;margin:8px 0;font-weight:600}
.msg.ok{color:var(--good)}
.msg.err{color:var(--bad)}
label.fld{display:block;font-family:var(--display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-size:16px;width:100%;min-height:46px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--text)}
textarea{min-height:90px;resize:vertical}
input[type=file]{max-width:100%;font-size:16px;color:var(--text)}
.hero{background:var(--c);color:var(--ci);border-radius:10px;padding:14px 16px 16px;margin-bottom:12px}
.hero .k{font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.hero .v{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin-top:2px}
.hero .s{font-family:var(--display);font-weight:600;font-size:1.4rem;letter-spacing:.06em;text-transform:uppercase}
.hero .m{font-size:.95rem;font-weight:500;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--cur));border-radius:10px;padding:12px;margin-bottom:10px}
.ex-name{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.03em;line-height:1.2;text-transform:uppercase}
.ex-target{color:var(--text);font-weight:600;font-size:.95rem;margin-top:2px}
.ex-last{color:var(--muted);font-size:.9rem;margin-top:2px}
details.expl{margin:6px 0}
details.expl>summary,details.day>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);list-style:none}
details.day>summary{color:var(--text);font-size:1.15rem}
details.expl>summary::-webkit-details-marker,details.day>summary::-webkit-details-marker{display:none}
details.expl>summary::before,details.day>summary::before{content:"+";display:inline-block;width:22px;font-weight:700}
details[open].expl>summary::before,details[open].day>summary::before{content:"\2212"}
details.day{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:10px;padding:0 12px;margin-bottom:10px}
details.day[open]{padding-bottom:4px}
details.day .ex{margin-top:2px}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.imgs figure{margin:0;min-width:0}
.imgs img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--surface2)}
.imgs figcaption{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--muted);margin-top:2px}
.imgmiss{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.85rem;color:var(--muted);background:var(--surface2);border-radius:6px;padding:6px}
.noimg{background:var(--surface2);border-radius:6px;padding:10px;color:var(--muted);font-size:.9rem;margin:6px 0}
.cue{margin:6px 0}
a.vid{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-weight:600}
.sets{margin-top:8px}
.srow{display:grid;grid-template-columns:4.6rem 1fr 1fr;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.srow.hd{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem;color:var(--muted);border-bottom:2px solid var(--line);padding-bottom:2px}
.srow.hd span:not(:first-child){text-align:center}
.srow .sn{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:1.05rem;color:var(--muted)}
.srow input.cell{min-height:50px;font-size:1.25rem;font-weight:600;text-align:center;padding-inline:4px}
.setbtns{display:flex;gap:8px;margin-top:8px}
.chk{display:flex;gap:12px;align-items:center;min-height:48px;cursor:pointer}

.chk small{display:block;color:var(--muted)}
.chk .nm{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;line-height:1.2}
.cor{border-bottom:1px solid var(--line);padding-bottom:2px;margin-bottom:4px}
.cor:last-child{border-bottom:0}
.dayh{border-left:8px solid var(--c);padding-left:10px}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.wd{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:6px 10px}
.wd b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;color:var(--muted)}
.wd span{font-family:var(--display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:1.05rem}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--surface2);font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--muted)}
td.wrapc{white-space:normal;min-width:130px}
tr.sub td{font-weight:700;background:var(--surface2)}
.chip{display:inline-block;padding:2px 12px;border-radius:4px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.95rem}
.chip.early{background:var(--surface2);color:var(--muted)}
.chip.now{background:var(--good-soft);color:var(--good)}
.chip.late{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;background:var(--surface2);color:var(--muted);padding:1px 8px;border-radius:4px;margin-left:8px;vertical-align:middle}
.up{color:var(--bad)} .down{color:var(--good)}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.last{fill:var(--accent)}
.chart text.lv{fill:var(--text);font-weight:700;font-size:11px}
.sess{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:0}
.sess .t{min-width:0}
.sess .nm{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum div{background:var(--surface2);border-radius:8px;padding:8px 10px;font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem;color:var(--muted)}
.sum b{display:block;font-size:2rem;line-height:1.1;color:var(--text);letter-spacing:.02em}
.rev{border-bottom:1px solid var(--line);padding:8px 0}
.rev:last-child{border-bottom:0}
.rev .rt{font-family:var(--display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:1.05rem}
.rev .rv{font-weight:700;color:var(--text)}
.rev .rd{font-size:.9rem;color:var(--muted)}
ul.plain{margin:0;padding:0;list-style:none}
ul.plain li{padding:8px 10px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
ul.plain li.warn{background:var(--warn-soft)}
.rev.warn{border-radius:6px;margin:4px 0}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;font-family:var(--display);font-size:.9rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;min-height:58px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}

.tab[aria-selected="true"] svg{stroke-width:2.5}

#backupPanel{margin-bottom:14px}
#backupPanel textarea{font-size:13px;min-height:90px}
.hide{display:none!important}
@media (prefers-reduced-motion: no-preference){ .tab{transition:color .15s} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;scroll-behavior:auto!important} }
</style>

<script>
// ===== GYM DATA (authored by Opus — do not change numbers or text) =====
const IMG_REMOTE = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
// img: id in free-exercise-db (public domain, Unlicense). null = no verified image.
const EX = {
  bench:{name:"Barbell Bench Press",img:"Barbell_Bench_Press_-_Medium_Grip",q:"barbell bench press proper form",cue:"Shoulder blades back and down, feet planted, bar to mid-chest."},
  incDb:{name:"Incline Dumbbell Press",img:"Incline_Dumbbell_Press",q:"incline dumbbell press form",cue:"Bench at about 30°, lower until you feel a stretch in the chest."},
  dbOhp:{name:"Seated Dumbbell Shoulder Press",img:"Dumbbell_Shoulder_Press",q:"seated dumbbell shoulder press form",cue:"Back supported, brace your abs, don't arch the lower back."},
  latRaise:{name:"Dumbbell Lateral Raise",img:"Side_Lateral_Raise",q:"dumbbell lateral raise form",cue:"Light weight, raise to shoulder height only, no swinging."},
  pushdown:{name:"Rope Triceps Pushdown",img:"Triceps_Pushdown_-_Rope_Attachment",q:"rope triceps pushdown form",cue:"Elbows pinned to your sides, spread the rope at the bottom."},
  ohExt:{name:"Cable Overhead Triceps Extension",img:"Cable_Rope_Overhead_Triceps_Extension",q:"cable overhead triceps extension form",cue:"Brace abs and glutes so the lower back doesn't arch."},
  pulldown:{name:"Wide-Grip Lat Pulldown",img:"Wide-Grip_Lat_Pulldown",q:"lat pulldown proper form",cue:"Pull the bar to your upper chest, chest up, don't lean back much."},
  cableRow:{name:"Seated Cable Row",img:"Seated_Cable_Rows",q:"seated cable row form",cue:"Back straight, pull to your belly, squeeze the shoulder blades."},
  facePull:{name:"Face Pull",img:"Face_Pull",q:"face pull proper form",cue:"Pull the rope to face level and spread the hands apart. Good for shoulder posture."},
  hammer:{name:"Hammer Curl",img:"Alternate_Hammer_Curl",q:"hammer curl form",cue:"Palms facing your body, elbows still."},
  bbCurl:{name:"Barbell Curl",img:"Barbell_Curl",q:"barbell curl form",cue:"No swinging with the back, lower all the way under control."},
  squat:{name:"Barbell Back Squat",img:"Barbell_Squat",q:"barbell back squat form for beginners",cue:"First 3-4 weeks: do the leg press or a goblet squat here instead, until a coach checks your squat. Then: chest up, knees track over toes, brace hard so the lower back doesn't arch."},
  rdl:{name:"Romanian Deadlift",img:"Romanian_Deadlift",q:"romanian deadlift proper form",cue:"Push the hips back, back flat, bar close to the legs. Key lift for hamstrings and glutes."},
  lyingCurl:{name:"Lying Leg Curl",img:"Lying_Leg_Curls",q:"lying leg curl form",cue:"Keep the hips pressed into the pad, don't arch."},

  calfStand:{name:"Standing Calf Raise",img:"Standing_Calf_Raises",q:"standing calf raise machine form",cue:"Full range: all the way down, all the way up."},
  hipThrust:{name:"Barbell Hip Thrust",img:"Barbell_Hip_Thrust",q:"barbell hip thrust form",cue:"Chin slightly tucked, lock out with the glutes, not the lower back. A key pelvic-tilt exercise."},
  machOhp:{name:"Machine Shoulder Press",img:"Machine_Shoulder_Military_Press",q:"machine shoulder press form",cue:"Back against the pad, don't lock the elbows at the top."},
  dbBench:{name:"Dumbbell Bench Press",img:"Dumbbell_Bench_Press",q:"dumbbell bench press form",cue:"Lower under control until the dumbbells are beside the chest."},
  crossover:{name:"Cable Crossover",img:"Cable_Crossover",q:"cable crossover chest form",cue:"Slight forward lean, hands meet in front of the chest."},
  dipMach:{name:"Dip Machine",img:"Dip_Machine",q:"dip machine triceps form",cue:"Elbows back, close to the body."},
  skull:{name:"EZ-Bar Skull Crusher",img:"EZ-Bar_Skullcrusher",q:"ez bar skull crusher form",cue:"Elbows fixed and pointing up, lower slightly behind the head."},
  assistPull:{name:"Assisted Pull-Up",img:"Band_Assisted_Pull-Up",q:"assisted pull up form",cue:"No band? Use the assisted pull-up machine or the lat pulldown."},
  dbRow:{name:"One-Arm Dumbbell Row",img:"One-Arm_Dumbbell_Row",q:"one arm dumbbell row form",cue:"Drive the elbow toward the hip, back flat."},
  revFly:{name:"Reverse Machine Fly (Rear Delt)",img:"Reverse_Machine_Flyes",q:"reverse pec deck rear delt form",cue:"Light weight, open the arms out and squeeze back."},
  incCurl:{name:"Incline Dumbbell Curl",img:"Incline_Dumbbell_Curl",q:"incline dumbbell curl form",cue:"Arms hang straight down, curl without the elbow moving forward."},
  legPress:{name:"Leg Press",img:"Leg_Press",q:"leg press proper form",cue:"Lower back stays on the seat the whole time, don't lock the knees at the top."},
  splitSquat:{name:"Dumbbell Split Squat",img:"Split_Squat_with_Dumbbells",q:"dumbbell split squat form",cue:"Squeeze the glute of the back leg; it also stretches the front of the hip."},
  seatedCurl:{name:"Seated Leg Curl",img:"Seated_Leg_Curl",q:"seated leg curl form",cue:"Pull all the way down, return slowly."},

function lineChart(pts,unit,aria){
var W=320,H=176,pl=40,pr=14,pt=18,pb=28;
var vals=pts.map(function(p){return p.v;});
var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
if(mn===mx){mn-=1;mx+=1;} else {var pad2=(mx-mn)*0.12;mn-=pad2;mx+=pad2;}
function X(i){return pts.length===1?(pl+(W-pl-pr)/2):pl+(W-pl-pr)*i/(pts.length-1);}
function Y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));}
var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+aria+'">';
for(var g=0;g<3;g++){
var gv=mn+(mx-mn)*g/2, gy=Y(gv);
s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'"/>';
s+='<text x="'+(pl-6)+'" y="'+(gy+3)+'" text-anchor="end">'+fmtNum(gv)+'</text>';
}
s+='<polyline class="ln" points="'+pts.map(function(p,i){return X(i).toFixed(1)+","+Y(p.v).toFixed(1);}).join(" ")+'"/>';
pts.forEach(function(p,i){
var last=i===pts.length-1;
s+='<circle class="dot'+(last?" last":"")+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last?5:3)+'"/>';
});
var lp=pts[pts.length-1];
s+='<text class="lv" x="'+Math.min(W-pr,X(pts.length-1)).toFixed(1)+'" y="'+(Y(lp.v)-9).toFixed(1)+'" text-anchor="middle">'+fmtNum(lp.v)+' '+unit+'</text>';
s+='<text x="'+pl+'" y="'+(H-8)+'" text-anchor="start">'+shortDate(pts[0].d)+'</text>';
if(pts.length>1) s+='<text x="'+(W-pr)+'" y="'+(H-8)+'" text-anchor="end">'+shortDate(lp.d)+'</text>';
s+='</svg>';
var d=document.createElement("div"); d.innerHTML=s; return d.firstChild;
}

}
p.appendChild(h("button",{class:"btn block",type:"button",style:"margin-top:12px",onclick:function(){bk.open=false;renderBackup();$("backupBtn").focus();}},"Close"));
if(focusId&&$(focusId)) $(focusId).focus();
}
function showMsg(){var m=$("bkMsg");if(m){m.textContent=bk.msg||"";m.className="msg "+(bk.kind||"ok");}}
/* ---------- shell ---------- */
function setTab(id){
disarm(); state.ui.tab=id; persist(); render(); window.scrollTo(0,0);
}
function renderNav(){
var nav=document.querySelector("#tabbar .in"); nav.textContent="";
TABS.forEach(function(t){
var b=h("button",{class:"tab",type:"button",role:"tab","aria-selected":state.ui.tab===t.id?"true":"false",id:"tab-"+t.id,onclick:function(){setTab(t.id);}});
b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+t.icon+'</svg>';
b.appendChild(h("span",null,t.label));
nav.appendChild(b);
});
}
function setPlate(){
var tab=state.ui.tab, pt;
if(tab==="today"||(tab!=="plan"&&tab!=="progress"&&tab!=="body"&&tab!=="food")){ ensureDraft(); pt=planType(draft.planKey); }
else pt=planType(nextPlanKey());
document.documentElement.setAttribute("data-plate",pt);
}
function render(focusId){
var view=$("view"); view.textContent="";
var tab=state.ui.tab;
setPlate();
if(tab==="plan") renderPlan(view);
else if(tab==="progress") renderProgress(view);
else if(tab==="body") renderBody(view);
else if(tab==="food") renderFood(view);
else renderToday(view);
renderNav(); renderBanner();
if(focusId&&$(focusId)) $(focusId).focus();
}
$("backupBtn").addEventListener("click",function(){
bk.open=!bk.open;
if(bk.open){ bk.expText=JSON.stringify(state); bk.msg=null; }
renderBackup(bk.open?"bkCopy":null);
});
persist();
render();
})();
</script>
</body></html>
