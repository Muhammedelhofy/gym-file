function lineChart(pts,unit,aria){
var W=320,H=176,pl=40,pr=14,pt=18,pb=28;
var vals=pts.map(function(p){return p.v;});
var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
if(mn===mx){mn-=1;mx+=1;} else {var pad2=(mx-mn)*0.12;mn-=pad2;mx+=pad2;}
function X(i){return pts.length===1?(pl+(W-pl-pr)/2):pl+(W-pl-pr)*i/(pts.length-1);}
function Y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));}
var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+aria+'" direction="ltr" style="direction:ltr">';
for(var g=0;g<3;g++){
var gv=mn+(mx-mn)*g/2, gy=Y(gv);
s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'"/>';
s+='<text x="'+(pl-6)+'" y="'+(gy+3)+'" text-anchor="end">'+fmtNum(gv)+'</text>';
}
s+='<polyline class="ln" points="'+pts.map(function(p,i){return X(i).toFixed(1)+","+Y(p.v).toFixed(1);}).join(" ")+'"/>';
pts.forEach(function(p,i){
var last=i===pts.length-1;
s+='<circle class="dot'+(last?" last":"")+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last?5:3)+'"/>';
});
var lp=pts[pts.length-1];
s+='<text class="lv" x="'+Math.min(W-pr,X(pts.length-1)).toFixed(1)+'" y="'+(Y(lp.v)-9).toFixed(1)+'" text-anchor="middle">'+fmtNum(lp.v)+' '+unit+'</text>';
s+='<text x="'+pl+'" y="'+(H-8)+'" text-anchor="start">'+shortDate(pts[0].d)+'</text>';
if(pts.length>1) s+='<text x="'+(W-pr)+'" y="'+(H-8)+'" text-anchor="end">'+shortDate(lp.d)+'</text>';
s+='</svg>';
var d=document.createElement("div"); d.innerHTML=s; return d.firstChild;
}

var f=FOODS[it[0]], g=it[1];
var rk=Math.round(g*f.v[0]/100), rp=Math.round(g*f.v[1]/100);
rows.push({name:f.ar,g:g,kcal:rk,prot:rp});
kc+=rk; pr+=rp; ca+=g*f.v[2]/100; fa+=g*f.v[3]/100;
});
return {rows:rows,kcal:kc,prot:pr,carb:ca,fat:fa};
}
function renderFood(root){
var calc=MEALS.map(calcMeal), T={kcal:0,prot:0,carb:0,fat:0};
calc.forEach(function(c){T.kcal+=c.kcal;T.prot+=c.prot;T.carb+=c.carb;T.fat+=c.fat;});
root.appendChild(h("h2",{style:"margin-top:0"},"ملخص الهدف اليومي"));
root.appendChild(h("div",{class:"card"},
h("div",{class:"sum"},
h("div",null,"سعرات",h("b",{class:"num"},T.kcal)),
h("div",null,"بروتين (جم)",h("b",{class:"num"},T.prot)),
h("div",null,"كارب (جم)",h("b",{class:"num"},Math.round(T.carb))),
h("div",null,"دهون (جم)",h("b",{class:"num"},Math.round(T.fat)))),
h("p",{class:"small",style:"margin-top:10px"},"+ لبن البروتين: "+SHAKE.protein+" جم بروتين، والسعرات من الملصق"),
h("p",{style:"font-weight:700;margin:0"},"إجمالي البروتين: ",h("span",{class:"num"},T.prot+SHAKE.protein)," جم"),
h("p",{class:"note",style:"margin:6px 0 0"},SHAKE.note)));
MEALS.forEach(function(m,i){
var c=calc[i];
root.appendChild(h("h2",null,m.name,h("span",{class:"tag"},m.time)));
var tb=h("tbody");
c.rows.forEach(function(r){ tb.appendChild(h("tr",null,h("td",{class:"wrapc"},r.name),h("td",{class:"num"},r.g),h("td",{class:"num"},r.kcal),h("td",{class:"num"},r.prot))); });
tb.appendChild(h("tr",{class:"sub"},h("td",null,"المجموع"),h("td",null,""),h("td",{class:"num"},c.kcal),h("td",{class:"num"},c.prot)));
root.appendChild(h("div",{class:"tablewrap"},h("table",null,
h("thead",null,h("tr",null,h("th",null,"الصنف"),h("th",null,"جرام"),h("th",null,"سعرات"),h("th",null,"بروتين"))),tb)));
if(m.extra) root.appendChild(h("p",{class:"small "+(hasWarn(m.extra)?"warn":""),style:"margin-top:8px"},m.extra));
if(m.swap) root.appendChild(h("p",{class:"small muted "+(hasWarn(m.swap)?"warn":""),style:"margin-top:4px"},"↺ "+m.swap));
});
root.appendChild(h("h2",null,"قواعد الأكل"));
var ul=h("ul",{class:"plain"});
NUTRITION_RULES.forEach(function(t){ ul.appendChild(h("li",{class:hasWarn(t)?"warn":null},t)); });
root.appendChild(ul);
root.appendChild(h("h2",null,"مراجعة الأرقام"));
var box=h("div",{class:"card"});
REVIEW.forEach(function(r){
box.appendChild(h("div",{class:"rev"+((hasWarn(r.t)||hasWarn(r.v)||hasWarn(r.d))?" warn":"")},
h("div",{style:"font-weight:600"},r.t),h("div",{class:"rv num"},r.v),h("div",{class:"rd"},r.d)));
});
root.appendChild(box);
}
/* ---------- backup ---------- */
var bk={open:false,msg:null,kind:"ok",pending:null,armed:false,impText:"",expText:""};
function summarize(o){return {s:o.sessions.length,m:o.measurements.length};}
function parseImport(text){
var o;
try{ o=JSON.parse(text); }catch(e){ return {err:"النص ده مش JSON سليم. تأكد إنك نسخت النسخة الاحتياطية كلها."}; }
if(!o||typeof o!=="object"||Array.isArray(o)) return {err:"الملف ده مش نسخة احتياطية من التطبيق."};
if(!Array.isArray(o.sessions)||!Array.isArray(o.measurements)) return {err:"الملف ناقصه قايمة التمرينات أو القياسات."};
return {ok:normalize(o)};
}
function reviewImport(text){
bk.impText=text; bk.armed=false;
if(!text.trim()){ bk.pending=null; bk.msg="الصق النسخة الاحتياطية أو اختار ملف الأول."; bk.kind="err"; renderBackup("impReview"); return; }
var r=parseImport(text);
if(r.err){ bk.pending=null; bk.msg=r.err; bk.kind="err"; }
else { bk.pending=r.ok; bk.msg=null; }
renderBackup("impReview");
}
function renderBackup(focusId){
var p=$("backupPanel");
p.classList.toggle("hide",!bk.open);
$("backupBtn").setAttribute("aria-expanded",bk.open?"true":"false");
p.textContent="";
if(!bk.open) return;
var exp=h("textarea",{id:"expText",readonly:true,"aria-label":"نص النسخة الاحتياطية",rows:"4"},bk.expText);
p.appendChild(h("h3",null,"نسخة احتياطية"));
p.appendChild(h("p",{class:"note"},"بياناتك محفوظة في المتصفح ده بس. خد نسخة من وقت للتاني."));
p.appendChild(exp);
p.appendChild(h("div",{class:"row2",style:"margin-top:8px"},
h("button",{class:"btn",id:"bkCopy",type:"button",onclick:function(){
var text=JSON.stringify(state); bk.expText=text; exp.value=text;
function fail(){ exp.focus(); try{exp.select();exp.setSelectionRange(0,text.length);}catch(e){} bk.msg="اضغط مطوّل وانسخ"; bk.kind="err"; showMsg(); }
function okc(){ bk.msg="اتنسخت ✓"; bk.kind="ok"; showMsg(); }
try{
if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(okc,fail);
else fail();
}catch(e){ fail(); }
}},"نسخ البيانات"),
h("button",{class:"btn",id:"bkDl",type:"button",onclick:function(){
var fname="gym-backup-"+today()+".json", data=JSON.stringify(state,null,1);
var dlP=(window.claude&&window.claude.use)?window.claude.use("downloads"):Promise.resolve(null);
dlP.then(function(dl){
if(dl){ return dl.save({filename:fname,data:data}).then(function(){bk.msg="اتحفظ الملف.";bk.kind="ok";showMsg();},function(){bk.msg="الحفظ اتلغى. استخدم «نسخ البيانات».";bk.kind="err";showMsg();}); }
legacyDl();
},legacyDl);
function legacyDl(){
try{
var blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
var url=URL.createObjectURL(blob);
var a=document.createElement("a"); a.href=url; a.download="gym-backup-"+today()+".json";
document.body.appendChild(a); a.click(); a.remove();
setTimeout(function(){URL.revokeObjectURL(url);},2000);
bk.msg="اتبدأ التحميل."; bk.kind="ok";
}catch(e){ bk.msg="التحميل مش شغال هنا. استخدم «نسخ البيانات»."; bk.kind="err"; }
showMsg();
}
}},"تحميل ملف")));
p.appendChild(h("p",{class:"note"},"التحميل بيشتغل لو فاتح الصفحة كملف أو من متصفح عادي"));
p.appendChild(h("div",{id:"bkMsg",class:"msg "+(bk.kind||"ok"),role:"status"},bk.msg||""));
p.appendChild(h("h3",{style:"margin-top:14px"},"استرجاع نسخة"));
p.appendChild(h("label",{class:"fld","for":"impText",style:"margin-top:8px"},"الصق النسخة هنا"));
p.appendChild(h("textarea",{id:"impText",dir:"ltr",oninput:function(e){bk.impText=e.target.value;bk.pending=null;bk.armed=false;}},bk.impText));
p.appendChild(h("label",{class:"fld","for":"impFile",style:"margin-top:8px"},"أو اختار ملف (.json)"));
p.appendChild(h("input",{type:"file",id:"impFile",accept:".json,application/json",onchange:function(e){
var f=e.target.files&&e.target.files[0]; if(!f) return;
var rd=new FileReader();
rd.onload=function(){ reviewImport(String(rd.result||"")); };
rd.onerror=function(){ bk.msg="معرفتش أقرأ الملف."; bk.kind="err"; renderBackup(); };
rd.readAsText(f);
}}));
p.appendChild(h("button",{class:"btn block",id:"impReview",type:"button",style:"margin-top:10px",onclick:function(){reviewImport($("impText").value);}},"راجع البيانات"));
if(bk.pending){
var c=summarize(bk.pending);
p.appendChild(h("div",{class:"warnbox",style:"margin-top:10px"},"هيستبدل: "+c.s+" تمرين و "+c.m+" قياس"));
p.appendChild(h("button",{class:"btn block "+(bk.armed?"armed":"danger"),id:"impGo",type:"button",style:"margin-top:8px",onclick:function(){
if(!bk.armed){ bk.armed=true; renderBackup("impGo"); return; }
state=bk.pending; state.ui.tab=state.ui.tab||"today"; persist();
bk.pending=null; bk.armed=false; bk.impText=""; bk.msg="اتبدلت البيانات ✓"; bk.kind="ok";
draft=null; render(); renderBackup();
}},bk.armed?"متأكد؟ اضغط تاني":"استبدل البيانات"));
}
p.appendChild(h("button",{class:"btn block",type:"button",style:"margin-top:12px",onclick:function(){bk.open=false;renderBackup();$("backupBtn").focus();}},"إغلاق"));
if(focusId&&$(focusId)) $(focusId).focus();
}
function showMsg(){var m=$("bkMsg");if(m){m.textContent=bk.msg||"";m.className="msg "+(bk.kind||"ok");}}
/* ---------- shell ---------- */
function setTab(id){
disarm(); state.ui.tab=id; persist(); render(); window.scrollTo(0,0);
}
function renderNav(){
var nav=document.querySelector("#tabbar .in"); nav.textContent="";
TABS.forEach(function(t){
var b=h("button",{class:"tab",type:"button",role:"tab","aria-selected":state.ui.tab===t.id?"true":"false",id:"tab-"+t.id,onclick:function(){setTab(t.id);}});
b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+t.icon+'</svg>';
b.appendChild(h("span",null,t.label));
nav.appendChild(b);
});
}
function render(focusId){
var view=$("view"); view.textContent="";
var tab=state.ui.tab;
if(tab==="plan") renderPlan(view);
else if(tab==="progress") renderProgress(view);
else if(tab==="body") renderBody(view);
else if(tab==="food") renderFood(view);
else renderToday(view);
renderNav(); renderBanner();
if(focusId&&$(focusId)) $(focusId).focus();
}
$("backupBtn").addEventListener("click",function(){
bk.open=!bk.open;
if(bk.open){ bk.expText=JSON.stringify(state); bk.msg=null; }
renderBackup(bk.open?"bkCopy":null);
});
persist();
render();
})();
</script>
